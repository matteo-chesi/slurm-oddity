[package]
name = "stage1"
version = "0.0.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.5.48", features = ["derive"] }
gethostname = "1.1.0"
iana-time-zone = "0.1.65"
raster = { path = "../../cosmodrome-raster" }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
sarus-suite-podman-driver = { git = "https://github.com/sarus-suite/podman-driver" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shellexpand = "3.1.2"
url = "2.5.8"
users = "0.11.0"
uuid = { version = "1.4.1", features = ["v4"] }
whoami = "2.1.2"
yaml_serde = "0.10.3"
