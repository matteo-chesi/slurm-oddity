[package]
name = "stage0"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
cfg-if = "1.0.4"
chrono = "0.4.45"
chrono-tz = "0.10.4"
const_format = "0.2.36"
gethostname = "1.1.0"
iana-time-zone = "0.1.65"
libc = "0.2.189"
log = "0.4.33"
nix = { version = "0.31.3", features = ["user", "fs"] }
raster = { path = "../../slurm-oddity-raster" }
serde = { version = "1.0.228", features = ["derive","rc"] }
serde_json = "1.0.151"
shellexpand = "3.1.1"
simple-logging = "2.0.2"
slurm-spank = "0.4.0"
tokio = { version = "1.53.1", features = ["process", "rt", "rt-multi-thread", "io-util"] }
toml = "0.9.5"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["fmt", "local-time"] }
users = "0.11.0"
whoami = "2.1.2"
